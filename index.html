<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Game</title>
    <style>
        /* To bundle a web font, put it under /public/fonts and declare it here:
        @font-face {
            font-family: 'MyFont';
            src: url('./fonts/MyFont.ttf') format('truetype');
            font-weight: 400 900;
            font-display: block;
        }
        */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #0a0a1c;
        }
        #wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1c;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<div id="wrapper"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
